name: Fix Education asset delivery

on:
  push:
    branches:
      - agent/fix-education-asset-delivery
  pull_request:
    branches: [main]
    paths:
      - 2026/Education.html
      - .github/workflows/fix-education-asset-delivery.yml
      - scripts/fix-education-asset-urls.py

permissions:
  contents: write

jobs:
  fix-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-education-asset-delivery

      - name: Apply immutable asset URLs
        run: python scripts/fix-education-asset-urls.py

      - name: Verify jsDelivr assets
        shell: bash
        run: |
          python - <<'PY'
          import urllib.request
          commit = 'b208597b68090c4f40243078099e1f13f7cf23db'
          checks = [
              (f'https://cdn.jsdelivr.net/gh/Kweinkauff29/Homepage@{commit}/2026/assets/ccor-education.js', 'ccorEducationApp', 'javascript'),
              (f'https://cdn.jsdelivr.net/gh/Kweinkauff29/Homepage@{commit}/2026/assets/ccor-education.css', '.ccor-education', 'css')
          ]
          for url, marker, kind in checks:
              req = urllib.request.Request(url, headers={'User-Agent':'CCOR-Education-Asset-Check/1.0'})
              with urllib.request.urlopen(req, timeout=90) as response:
                  body = response.read().decode('utf-8', errors='replace')
                  content_type = response.headers.get('content-type','')
              print(url, response.status, content_type, len(body), marker in body)
              assert response.status == 200
              assert marker in body
              assert kind in content_type.lower(), content_type
          PY

      - name: Validate local JavaScript
        run: node --check 2026/assets/ccor-education.js

      - name: Verify page references
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'CCOR EDUCATION YEAR + INSTRUCTOR DIRECTORY BUILD: 2026-08-03b' 2026/Education.html
          grep -q 'cdn.jsdelivr.net/gh/Kweinkauff29/Homepage@b208597b68090c4f40243078099e1f13f7cf23db/2026/assets/ccor-education.css' 2026/Education.html
          grep -q 'cdn.jsdelivr.net/gh/Kweinkauff29/Homepage@b208597b68090c4f40243078099e1f13f7cf23db/2026/assets/ccor-education.js' 2026/Education.html
          ! grep -q 'kweinkauff29.github.io/Homepage/2026/assets/ccor-education' 2026/Education.html

      - name: Commit production page fix
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 2026/Education.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Serve Education assets from immutable jsDelivr URLs"
          git push origin HEAD:agent/fix-education-asset-delivery
