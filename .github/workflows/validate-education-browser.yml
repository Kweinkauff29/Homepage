name: Validate Education page in Chromium

on:
  pull_request:
    branches: [main]
    paths:
      - 2026/Education.html
      - 2026/assets/ccor-education.css
      - 2026/assets/ccor-education.js
      - tests/education-page-smoke.mjs
      - .github/workflows/validate-education-browser.yml

permissions:
  contents: read

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Validate JavaScript syntax
        run: node --check 2026/assets/ccor-education.js

      - name: Prepare local test page
        shell: bash
        run: |
          cp 2026/Education.html 2026/Education.smoke.html
          python - <<'PY'
          from pathlib import Path
          path = Path('2026/Education.smoke.html')
          text = path.read_text()
          text = text.replace(
              'https://kweinkauff29.github.io/Homepage/2026/assets/ccor-education.css?v=20260803a',
              '/2026/assets/ccor-education.css'
          )
          text = text.replace(
              'https://kweinkauff29.github.io/Homepage/2026/assets/ccor-education.js?v=20260803a',
              '/2026/assets/ccor-education.js'
          )
          path.write_text(text)
          PY

      - name: Download verified live Education payload
        shell: bash
        run: |
          python - <<'PY'
          import json, time, urllib.request
          from pathlib import Path

          url = 'https://www.ccreschool.com/api/public-events?page=education'
          error = None
          for attempt in range(7):
              try:
                  request = urllib.request.Request(url, headers={
                      'Accept': 'application/json',
                      'User-Agent': 'CCOR-Education-Browser-Smoke/1.0',
                      'Cache-Control': 'no-cache'
                  })
                  with urllib.request.urlopen(request, timeout=120) as response:
                      body = response.read()
                  payload = json.loads(body.decode('utf-8'))
                  assert len(payload.get('events') or []) > 100
                  assert len(payload.get('instructors') or []) == 10
                  Path('/tmp/education-api.json').write_bytes(body)
                  print(f"Downloaded {len(payload['events'])} Education records and {len(payload['instructors'])} instructors")
                  break
              except Exception as exc:
                  error = exc
                  time.sleep(4 * (attempt + 1))
          else:
              raise error
          PY

      - name: Install Chromium test runtime
        shell: bash
        run: |
          rm -rf node_modules
          npm install --no-save --ignore-scripts playwright@1.49.1
          npx playwright install --with-deps chromium

      - name: Run local web server
        shell: bash
        run: |
          python -m http.server 8765 --bind 127.0.0.1 > /tmp/ccor-education-http.log 2>&1 &
          echo $! > /tmp/ccor-education-http.pid
          sleep 2

      - name: Run Education browser smoke test
        run: node tests/education-page-smoke.mjs
