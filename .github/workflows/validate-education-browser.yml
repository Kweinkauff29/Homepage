name: Validate Education page in Chromium

on:
  push:
    branches:
      - agent/education-year-instructor-directory
  pull_request:
    branches: [main]
    paths:
      - 2026/Education.html
      - 2026/assets/ccor-education.css
      - 2026/assets/ccor-education.js
      - tests/education-page-smoke.mjs
      - .github/workflows/validate-education-browser.yml

permissions:
  contents: write

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/education-year-instructor-directory

      - name: Apply local-date fix
        run: python scripts/fix-education-local-dates.py

      - name: Validate JavaScript syntax
        run: node --check 2026/assets/ccor-education.js

      - name: Prepare local test page
        shell: bash
        run: |
          cp 2026/Education.html 2026/Education.smoke.html
          python - <<'PY'
          from pathlib import Path
          path = Path('2026/Education.smoke.html')
          text = path.read_text()
          text = text.replace(
              'https://kweinkauff29.github.io/Homepage/2026/assets/ccor-education.css?v=20260803a',
              '/2026/assets/ccor-education.css'
          )
          text = text.replace(
              'https://kweinkauff29.github.io/Homepage/2026/assets/ccor-education.js?v=20260803a',
              '/2026/assets/ccor-education.js'
          )
          path.write_text(text)
          PY

      - name: Install Chromium test runtime
        shell: bash
        run: |
          rm -rf node_modules
          npm install --no-save --ignore-scripts playwright@1.49.1
          npx playwright install --with-deps chromium

      - name: Run local web server
        shell: bash
        run: |
          python -m http.server 8765 --bind 127.0.0.1 > /tmp/ccor-education-http.log 2>&1 &
          echo $! > /tmp/ccor-education-http.pid
          sleep 2

      - name: Run Education browser smoke test
        run: node tests/education-page-smoke.mjs

      - name: Commit local-date fix
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 2026/assets/ccor-education.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Parse Education calendar dates in local time"
          git push origin HEAD:agent/education-year-instructor-directory
