name: Reword highlighted calendar sections

on:
  push:
    branches:
      - agent/reword-highlighted-classes

permissions:
  contents: write

jobs:
  update-copy:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace favorites language
        run: |
          python - <<'PY'
          from pathlib import Path

          paths = [
              Path('2026/Education.html'),
              Path('2026/Events.html'),
              Path('2026/Committees.html'),
              Path('2026/AllEvents.html'),
              Path('2026/assets/ccor-events.js'),
          ]

          replacements = [
              ('★ FAVORITES FIRST', '★ COMING SOON'),
              ('★ CURATED FIRST ROW', '★ COMING SOON'),
              ("['FAVORITE CLASSES', 'Closest upcoming in-person CE classes appear first unless staff stars other classes.']", "['HIGHLIGHTED CLASSES', 'Upcoming in-person CE classes are highlighted first, followed by other classes coming soon.']"),
              ("['FAVORITE CLASSES', 'Staff favorites appear first. Without favorites, the closest in-person CE classes receive priority.']", "['HIGHLIGHTED CLASSES', 'Upcoming in-person CE classes are highlighted first, followed by other classes coming soon.']"),
              ("['FAVORITE EVENTS', 'Staff-starred events appear first.']", "['HIGHLIGHTED EVENTS', 'Selected upcoming events are highlighted here.']"),
              ("['FAVORITE EVENTS', 'Staff favorites appear first, followed by the remaining events in date order.']", "['HIGHLIGHTED EVENTS', 'Selected upcoming events are highlighted here.']"),
              ("['FAVORITE COMMITTEE MEETINGS', 'Staff-starred committee meetings appear first.']", "['HIGHLIGHTED COMMITTEE MEETINGS', 'Selected upcoming committee meetings are highlighted here.']"),
              ("['FAVORITE COMMITTEE MEETINGS', 'Staff favorites appear first, followed by the remaining meetings in date order.']", "['HIGHLIGHTED COMMITTEE MEETINGS', 'Selected upcoming committee meetings are highlighted here.']"),
              ("['FAVORITES AT CCOR', 'Staff-starred classes, events and meetings appear first.']", "['HIGHLIGHTED AT CCOR', 'Selected upcoming classes, events and meetings are highlighted here.']"),
              ("['FAVORITES AT CCOR', 'Staff favorites appear first across classes, events and committee meetings.']", "['HIGHLIGHTED AT CCOR', 'Selected upcoming classes, events and meetings are highlighted here.']"),
              ("badge.textContent = '★ FAVORITE'", "badge.textContent = '★ HIGHLIGHTED'"),
              ("badge.textContent = '★ FEATURED'", "badge.textContent = '★ HIGHLIGHTED'"),
              ('CCOR INLINE FAVORITES + CALENDAR', 'CCOR INLINE HIGHLIGHTS + CALENDAR'),
          ]

          for path in paths:
              text = path.read_text(encoding='utf-8')
              original = text
              for old, new in replacements:
                  text = text.replace(old, new)
              if text != original:
                  path.write_text(text, encoding='utf-8')

          html_paths = paths[:4]
          forbidden = [
              '★ FAVORITES FIRST',
              'FAVORITE CLASSES',
              'FAVORITE EVENTS',
              'FAVORITE COMMITTEE MEETINGS',
              'FAVORITES AT CCOR',
              'unless staff stars other classes',
          ]
          required = {
              'Education.html': ['★ COMING SOON', 'HIGHLIGHTED CLASSES', 'Upcoming in-person CE classes are highlighted first, followed by other classes coming soon.'],
              'Events.html': ['★ COMING SOON', 'HIGHLIGHTED EVENTS', 'Selected upcoming events are highlighted here.'],
              'Committees.html': ['★ COMING SOON', 'HIGHLIGHTED COMMITTEE MEETINGS', 'Selected upcoming committee meetings are highlighted here.'],
              'AllEvents.html': ['★ COMING SOON', 'HIGHLIGHTED AT CCOR', 'Selected upcoming classes, events and meetings are highlighted here.'],
          }

          for path in html_paths:
              text = path.read_text(encoding='utf-8')
              for phrase in forbidden:
                  if phrase in text:
                      raise SystemExit(f'{path}: old visible wording remains: {phrase}')
              for phrase in required[path.name]:
                  if phrase not in text:
                      raise SystemExit(f'{path}: expected new wording missing: {phrase}')

          print('Updated highlighted-section copy on all four WordPress pages.')
          PY

      - name: Remove temporary workflow
        run: rm .github/workflows/reword-highlighted-sections.yml

      - name: Commit updated wording
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 2026/Education.html 2026/Events.html 2026/Committees.html 2026/AllEvents.html 2026/assets/ccor-events.js .github/workflows/reword-highlighted-sections.yml
          git commit -m "Reword calendar highlights as coming soon"
          git push
