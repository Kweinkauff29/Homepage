name: Apply Directory Page Fix

on:
  workflow_dispatch:
  push:
    branches:
      - feature/member-controlled-realtor-directory
    paths:
      - '.github/workflows/apply-directory-page-fix.yml'
      - '2026/patch_directory_page.py'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/member-controlled-realtor-directory
      - run: python '2026/patch_directory_page.py'
      - name: Commit cleaned page
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add '2026/AGENT DIRECTORY/index.html'
          if ! git diff --cached --quiet; then
            git commit -m 'Fix initial directory loading placeholders'
            git pull --rebase origin feature/member-controlled-realtor-directory
            git push origin HEAD:feature/member-controlled-realtor-directory
          fi
