name: Inline WordPress calendars

on:
  push:
    branches:
      - agent/inline-calendar-injection
    paths:
      - scripts/inline_calendar_into_pages.py
      - .github/workflows/inline-wordpress-calendars.yml
      - 2026/assets/ccor-events.js
      - 2026/assets/ccor-events.css
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-inline-pages:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/inline-calendar-injection
          fetch-depth: 0

      - name: Inline favorite and calendar system
        run: python3 scripts/inline_calendar_into_pages.py

      - name: Validate generated pages
        run: |
          python3 - <<'PY'
          from pathlib import Path
          pages = {
              '2026/Education.html': 'education',
              '2026/Events.html': 'event',
              '2026/Committees.html': 'committee',
              '2026/AllEvents.html': 'all',
          }
          for filename, page in pages.items():
              text = Path(filename).read_text(encoding='utf-8')
              assert text.count('CCOR INLINE FAVORITES + CALENDAR START') == 1
              assert text.count('CCOR INLINE FAVORITES + CALENDAR END') == 1
              assert text.count('id="eventsGrid"') == 1
              assert f'data-ccor-page="{page}"' in text
              assert 'assets/ccor-events.js' not in text
              assert 'ccorCalendarInjection' in text
              assert '★ FAVORITE' in text
          PY

      - name: Commit generated WordPress pages
        run: |
          if git diff --quiet -- 2026/Education.html 2026/Events.html 2026/Committees.html 2026/AllEvents.html; then
            echo 'No generated changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 2026/Education.html 2026/Events.html 2026/Committees.html 2026/AllEvents.html
          git commit -m 'Inline favorite and calendar system into WordPress pages'
          git push origin HEAD:agent/inline-calendar-injection
