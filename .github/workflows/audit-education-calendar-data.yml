name: Audit Education calendar data

on:
  push:
    branches:
      - agent/audit-education-calendar-data
    paths:
      - .github/workflows/audit-education-calendar-data.yml

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/audit-education-calendar-data

      - name: Fetch and analyze event feeds
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audit
          python - <<'PY'
          import json, re, urllib.request
          from collections import Counter

          feeds = {
              "education_api": "https://www.ccreschool.com/api/public-events?page=education",
              "growthzone": "https://gz-realestate-proxy.bonitaspringsrealtors.workers.dev/events/all?enriched=true",
          }

          def fetch(url):
              req = urllib.request.Request(url, headers={"Accept":"application/json","User-Agent":"CCOR-Education-Audit/1.0"})
              with urllib.request.urlopen(req, timeout=60) as response:
                  return json.loads(response.read().decode("utf-8"))

          def first(d, names):
              for name in names:
                  if isinstance(d, dict) and d.get(name) not in (None, ""):
                      return d.get(name)
              return None

          def extract_rows(payload):
              if isinstance(payload, list): return payload
              for key in ("events","Results","results","items","data"):
                  value = payload.get(key) if isinstance(payload, dict) else None
                  if isinstance(value, list): return value
              return []

          def strip_html(value):
              value = str(value or "")
              value = re.sub(r"<br\s*/?>", "\n", value, flags=re.I)
              value = re.sub(r"<[^>]+>", " ", value)
              value = value.replace("&nbsp;", " ").replace("&amp;", "&")
              return re.sub(r"[ \t]+", " ", value).strip()

          instructor_patterns = [
              re.compile(r"\b(?:instructor|presenter|speaker|taught by|facilitator)\s*[:\-–—]\s*([^\n|;<>]+)", re.I),
              re.compile(r"\bwith\s+([A-Z][A-Za-z.'’\-]+(?:\s+[A-Z][A-Za-z.'’\-]+){1,3})\b"),
              re.compile(r"\bby\s+([A-Z][A-Za-z.'’\-]+(?:\s+[A-Z][A-Za-z.'’\-]+){1,3})\b"),
          ]

          output = {}
          for feed_name, url in feeds.items():
              try:
                  payload = fetch(url)
                  rows = extract_rows(payload)
                  sample_fields = Counter()
                  normalized = []
                  for row in rows:
                      if not isinstance(row, dict): continue
                      sample_fields.update(row.keys())
                      title = strip_html(first(row,["name","title","Name","EventName"]))
                      desc = strip_html(first(row,["description","Description","LongDescription","ShortDescription"]))
                      start = first(row,["startDate","StartDate","StartDateLocal","EventStartDate","start"])
                      image = first(row,["image","imageUrl","ImageUrl","ImageURL","FeaturedImage","PhotoUrl","photoUrl","flyer","flyerUrl"])
                      categories = first(row,["categories","Categories","CategoryName","CalendarName","category"])
                      candidates=[]
                      for pat in instructor_patterns:
                          for match in pat.finditer(desc):
                              name = re.sub(r"\s+", " ", match.group(1)).strip(" .,:;-–—")
                              if name and name not in candidates: candidates.append(name)
                      normalized.append({
                          "id": first(row,["id","key","Id","EventId","EventID"]),
                          "title": title,
                          "start": start,
                          "categories": categories,
                          "image": image,
                          "description": desc[:1200],
                          "instructor_candidates": candidates,
                      })
                  dates = sorted([str(x["start"]) for x in normalized if x.get("start")])
                  output[feed_name] = {
                      "url": url,
                      "payload_type": type(payload).__name__,
                      "payload_keys": list(payload.keys()) if isinstance(payload,dict) else [],
                      "count": len(normalized),
                      "earliest": dates[0] if dates else None,
                      "latest": dates[-1] if dates else None,
                      "common_fields": sample_fields.most_common(80),
                      "events": normalized,
                  }
              except Exception as exc:
                  output[feed_name] = {"url":url,"error":repr(exc)}

          with open("audit/education-calendar-data.json","w",encoding="utf-8") as f:
              json.dump(output,f,indent=2,ensure_ascii=False)
          PY

      - name: Commit audit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audit/education-calendar-data.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record Education calendar data audit"
          git push origin HEAD:agent/audit-education-calendar-data
