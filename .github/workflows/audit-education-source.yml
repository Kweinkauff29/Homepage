name: Audit Education page source

on:
  push:
    branches:
      - agent/audit-education-calendar-data
    paths:
      - .github/workflows/audit-education-source.yml

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/audit-education-calendar-data
      - name: Record source structure
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audit
          {
            echo "LINE_COUNT=$(wc -l < 2026/Education.html)"
            echo "BYTE_COUNT=$(wc -c < 2026/Education.html)"
            echo
            grep -nE "data-ccor-page|API_URL|FALLBACK_URL|function normalize|function render|function loadData|featured|calendar|instructor|flyerUrl|ccor-logo|CCOR-Horz|BASE_URL|events/all" 2026/Education.html | head -n 400 || true
          } > audit/education-source-map.txt
      - name: Commit report
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audit/education-source-map.txt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record Education source map"
          git push origin HEAD:agent/audit-education-calendar-data
