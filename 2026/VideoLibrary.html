            --brand-primary: #03AAE1;
            --brand-secondary: #0CA7A4;
            --brand-accent: #7EF0F0;
            --brand-dark: #006b86;
            --ink: #0f172a;
            --muted: #64748b;
            --surface: #f7fbff;
            --line: #e5e7eb;
            --radius: 16px;
            --shadow-sm: 0 2px 8px rgba(2, 8, 20, 0.06);
            --shadow-md: 0 8px 24px rgba(2, 8, 20, 0.08);
            --shadow-lg: 0 18px 48px rgba(2, 8, 20, 0.12);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;

            min-height: 100vh;
            color: var(--ink);

        /* Header */
        .header {
            background: linear-gradient(120deg, #7EF0F0 0%, #03AAE1 18%, #0CA7A4 48%, #006b86 78%, #7EF0F0 100%);
            background-size: 400% 100%;
            animation: ribbonFlow 10s ease-in-out infinite alternate;
            padding: 48px 24px 56px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        @keyframes ribbonFlow {
            0% {
                background-position: 0% 50%;
            }

            100% {
                background-position: 100% 50%;
            }
        }

        .header::before {
            content: "";
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at 30% 20%, rgba(255, 255, 255, 0.2) 0%, transparent 50%),
                radial-gradient(circle at 70% 80%, rgba(255, 255, 255, 0.1) 0%, transparent 40%);
            pointer-events: none;
        }

        .header h1 {
            font-size: clamp(2rem, 5vw, 3rem);
            font-weight: 800;
            color: #fff;
            text-shadow: 0 2px 12px rgba(0, 0, 0, 0.15);
            margin-bottom: 8px;
            position: relative;
        }

        .header p {
            font-size: 1.1rem;
            color: rgba(255, 255, 255, 0.9);
            max-width: 600px;
            margin: 0 auto;
            position: relative;
        }

        .header .video-count {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-top: 20px;
            padding: 10px 20px;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            border-radius: 999px;
            font-weight: 600;
            color: #fff;
            font-size: 0.95rem;
        }

        /* Search Bar */
        .search-container {
            max-width: 600px;
            margin: -28px auto 0;
            padding: 0 24px;
            position: relative;
            z-index: 200;
        }

        .search-wrapper {
            position: relative;
        }

        .search-input {
            width: 100%;
            padding: 16px 20px 16px 52px;
            border: 2px solid transparent;
            border-radius: 16px;
            font-size: 1rem;
            font-weight: 500;
            background: #fff;
            box-shadow: var(--shadow-lg);
            transition: all 0.2s ease;
        }

        .search-input:focus {
            outline: none;
            border-color: var(--brand-primary);
            box-shadow: var(--shadow-lg), 0 0 0 4px rgba(3, 170, 225, 0.15);
        }

        .search-icon {
            position: absolute;
            left: 18px;
            top: 50%;
            transform: translateY(-50%);
            width: 22px;
            height: 22px;
            color: var(--muted);
            pointer-events: none;
        }

        .search-dropdown {
            position: absolute;
            top: calc(100% + 8px);
            left: 0;
            right: 0;
            background: #fff;
            border-radius: 16px;
            box-shadow: var(--shadow-lg);
            max-height: 400px;
            overflow-y: auto;
            display: none;
            z-index: 300;
        }

        .search-dropdown.active {
            display: block;
        }

        .search-category {
            padding: 12px 16px 6px;
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--brand-secondary);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            border-bottom: 1px solid var(--line);
        }

        .search-result {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 12px 16px;
            cursor: pointer;
            transition: background 0.15s ease;
        }

        .search-result:hover {
            background: var(--surface);
        }

        .search-result-thumb {
            width: 48px;
            height: 48px;
            border-radius: 8px;
            object-fit: cover;
            flex-shrink: 0;
        }

        .search-result-info {
            flex: 1;
            min-width: 0;
        }

        .search-result-title {
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--ink);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .search-result-category {
            font-size: 0.8rem;
            color: var(--muted);
        }

        .search-suggestions {
            padding: 12px 16px;
            border-top: 1px solid var(--line);
        }

        .search-suggestions-label {
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 10px;
        }

        .suggestion-chips {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .suggestion-chip {
            padding: 8px 14px;
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: 999px;
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--ink);
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .suggestion-chip:hover {
            background: var(--brand-primary);
            border-color: var(--brand-primary);
            color: #fff;
        }

        .no-results-msg {
            padding: 24px 16px;
            text-align: center;
            color: var(--muted);
        }

        /* Filter Tabs */
        .filter-bar {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
            padding: 24px 16px;
            background: #fff;
            border-bottom: 1px solid var(--line);
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: var(--shadow-sm);
            margin-top: 16px;
        }

        .filter-btn {
            padding: 12px 24px;
            border: 1.5px solid var(--line);
            background: #fff;
            border-radius: 999px;
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--muted);
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .filter-btn:hover {
            border-color: var(--brand-primary);
            color: var(--brand-primary);
        }

        .filter-btn.active {
            background: linear-gradient(135deg, var(--brand-primary), var(--brand-secondary));
            border-color: transparent;
            color: #fff;
            box-shadow: 0 4px 12px rgba(3, 170, 225, 0.3);
        }

        /* Main Content */
        .main {
            max-width: 1400px;
            margin: 0 auto;
            padding: 32px 24px 64px;
        }

        /* Video Grid */
        .video-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 28px;
        }

        .video-card {
            background: #fff;
            border-radius: var(--radius);
            overflow: hidden;
            box-shadow: var(--shadow-md);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            cursor: pointer;
        }

        .video-card:hover {
            transform: translateY(-6px);
            box-shadow: var(--shadow-lg);
        }

        .video-wrapper {
            position: relative;
            aspect-ratio: 9/16;
            background: #1a1a1a;
            overflow: hidden;
        }

        .thumbnail {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 100%;
            height: 100%;
            min-width: 100%;
            min-height: 100%;
            object-fit: cover;
            object-position: center center;
            transform: translate(-50%, -50%) scale(1.01);
            transition: opacity 0.3s ease;
        }

        .video-embed {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .video-card:hover .thumbnail {
            opacity: 0;
        }

        .video-card:hover .video-embed {
            opacity: 1;
        }

        .play-overlay {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.25);
            opacity: 1;
            transition: opacity 0.3s ease;
            pointer-events: none;
        }

        .video-card:hover .play-overlay {
            opacity: 0;
        }

        .play-btn {
            width: 64px;
            height: 64px;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
        }

        .play-btn svg {
            width: 28px;
            height: 28px;
            fill: var(--brand-primary);
            margin-left: 4px;
        }

        .video-info {
            padding: 20px;
        }

        .video-title {
            font-size: 1rem;
            font-weight: 700;
            color: var(--ink);
            line-height: 1.4;
            margin-bottom: 8px;
        }

        .video-description {
            font-size: 0.9rem;
            color: var(--muted);
            line-height: 1.5;
            margin-bottom: 12px;
        }

        .video-category {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.03em;

            background: linear-gradient(135deg, #d1fae5, #ccfbf1);

        }

        /* Modal */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.85);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 24px;
            backdrop-filter: blur(8px);
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-content {
            position: relative;
            width: 90vw;
            max-width: 500px;
            height: 85vh;
            max-height: 900px;
            background: #000;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 24px 80px rgba(0, 0, 0, 0.4);
        }

        .modal-close {
            position: absolute;
            top: -48px;
            right: 0;
            width: 40px;
            height: 40px;
            background: rgba(255, 255, 255, 0.15);
            border: none;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s ease;
        }

        .modal-close:hover {
            background: rgba(255, 255, 255, 0.25);
        }

        .modal-close svg {
            width: 20px;
            height: 20px;
            stroke: #fff;
        }

        .modal-video {
            width: 100%;
            height: 100%;
        }

        .modal-video iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .header {
                padding: 32px 16px 40px;
            }

            .search-container {
                margin-top: -24px;
                padding: 0 16px;
            }

            .video-grid {
                grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
                gap: 20px;
            }

            .video-info {
                padding: 16px;
            }

            .video-title {
                font-size: 0.95rem;
            }

            .filter-bar {
                padding: 16px 12px;
                gap: 8px;
            }

            .filter-btn {
                padding: 10px 18px;
                font-size: 0.85rem;
            }
        }

        /* No results */
        .no-results {
            text-align: center;
            padding: 64px 24px;
            color: var(--muted);
        }

        .no-results svg {
            width: 64px;
            height: 64px;
            margin-bottom: 16px;
            opacity: 0.5;
        }
    </style>
</head>

        // Combined videos: Tech Tips first, then What to Know Wednesday
        const videos = [...techVideos, ...wtknVideos];

        // Popular search suggestions
        const popularSearches = [
            "Agent 3000", "MLS", "FOREWARN", "Contract", "Flood Maps",
            "Sabal Sign", "CRSP", "Supra", "Realist", "New Agent", "RPR"
        ];

        const grid = document.getElementById('videoGrid');
        const modal = document.getElementById('modal');
        const modalVideo = document.getElementById('modalVideo');
        const modalClose = document.getElementById('modalClose');
        const filterBtns = document.querySelectorAll('.filter-btn');
        const noResults = document.getElementById('noResults');
        const videoCount = document.getElementById('videoCount');
        const searchInput = document.getElementById('searchInput');
        const searchDropdown = document.getElementById('searchDropdown');
        const searchResults = document.getElementById('searchResults');
        const suggestionChips = document.getElementById('suggestionChips');

        function getThumbnail(id) {
            return `https://i.ytimg.com/vi/${id}/hq720.jpg`;
        }

        function createCard(video) {
            const card = document.createElement('div');
            card.className = 'video-card';
            card.dataset.category = video.category;
            card.dataset.videoId = video.id;

            card.innerHTML = `
                <div class="video-wrapper">
                    <img class="thumbnail" src="${getThumbnail(video.id)}" alt="${video.title}" loading="lazy">
                    <iframe class="video-embed" 
                        data-src="https://www.youtube.com/embed/${video.id}?autoplay=1&mute=1&loop=1&playlist=${video.id}&controls=0&modestbranding=1"
                        allow="autoplay; encrypted-media" 
                        allowfullscreen></iframe>
                    <div class="play-overlay">
                        <div class="play-btn">
                            <svg viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
                        </div>
                    </div>
                </div>
                <div class="video-info">
                    <h3 class="video-title">${video.title}</h3>
                    <p class="video-description">${video.description}</p>
                    <span class="video-category ${video.category}">${getCategoryLabel(video.category)}</span>
                </div>
            `;

            // Autoplay on hover
            let hoverTimeout;
            card.addEventListener('mouseenter', () => {
                hoverTimeout = setTimeout(() => {
                    const iframe = card.querySelector('.video-embed');
                    if (iframe && !iframe.src) {
                        iframe.src = iframe.dataset.src;
                    }
                }, 300);
            });

            card.addEventListener('mouseleave', () => {
                clearTimeout(hoverTimeout);
                const iframe = card.querySelector('.video-embed');
                if (iframe) {
                    iframe.src = '';
                }
            });

            // Click to open modal
            card.addEventListener('click', (e) => {
                if (e.target.tagName !== 'IFRAME') {
                    openModal(video.id);
                }
            });

            return card;
        }

        function getCategoryLabel(cat) {
            const labels = {
                tech: '🔧 Tech Tip Tuesday',
                wtkw: '📰 What to Know Wednesday'
            };
            return labels[cat] || cat;
        }

        function renderVideos(filter = 'all') {
            grid.innerHTML = '';
            const filtered = filter === 'all' ? videos : videos.filter(v => v.category === filter);

            if (filtered.length === 0) {
                noResults.style.display = 'block';
            } else {
                noResults.style.display = 'none';
                filtered.forEach(video => grid.appendChild(createCard(video)));
            }

            videoCount.textContent = `${filtered.length} Video${filtered.length !== 1 ? 's' : ''}`;
        }

        // Modal functions
        function openModal(videoId) {
            modalVideo.innerHTML = `<iframe src="https://www.youtube.com/embed/${videoId}?autoplay=1" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>`;
            modal.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeModal() {
            modal.classList.remove('active');
            modalVideo.innerHTML = '';
            document.body.style.overflow = '';
        }

        // Search functions
        function searchVideos(query) {
            const q = query.toLowerCase().trim();
            if (!q) return [];

            return videos.filter(video => {
                const titleMatch = video.title.toLowerCase().includes(q);
                const descMatch = video.description.toLowerCase().includes(q);
                const keywordMatch = video.keywords.some(kw => kw.toLowerCase().includes(q));
                return titleMatch || descMatch || keywordMatch;
            }).slice(0, 8);
        }

        function renderSearchResults(results, query) {
            if (results.length === 0) {
                searchResults.innerHTML = `<div class="no-results-msg">No videos found for "${query}"</div>`;
                return;
            }

            // Group by category
            const techResults = results.filter(v => v.category === 'tech');
            const wtknResults = results.filter(v => v.category === 'wtkw');

            let html = '';

            if (techResults.length > 0) {
                html += `<div class="search-category">🔧 Tech Tip Tuesday</div>`;
                techResults.forEach(video => {
                    html += `
                        <div class="search-result" data-video-id="${video.id}">
                            <img class="search-result-thumb" src="${getThumbnail(video.id)}" alt="">
                            <div class="search-result-info">
                                <div class="search-result-title">${video.title}</div>
                                <div class="search-result-category">${video.description.slice(0, 60)}...</div>
                            </div>
                        </div>
                    `;
                });
            }

            if (wtknResults.length > 0) {
                html += `<div class="search-category">📰 What to Know Wednesday</div>`;
                wtknResults.forEach(video => {
                    html += `
                        <div class="search-result" data-video-id="${video.id}">
                            <img class="search-result-thumb" src="${getThumbnail(video.id)}" alt="">
                            <div class="search-result-info">
                                <div class="search-result-title">${video.title}</div>
                                <div class="search-result-category">${video.description.slice(0, 60)}...</div>
                            </div>
                        </div>
                    `;
                });
            }

            searchResults.innerHTML = html;

            // Add click handlers
            searchResults.querySelectorAll('.search-result').forEach(el => {
                el.addEventListener('click', () => {
                    openModal(el.dataset.videoId);
                    searchDropdown.classList.remove('active');
                    searchInput.value = '';
                });
            });
        }

        function renderSuggestions() {
            suggestionChips.innerHTML = popularSearches.map(term =>
                `<button class="suggestion-chip">${term}</button>`
            ).join('');

            suggestionChips.querySelectorAll('.suggestion-chip').forEach(chip => {
                chip.addEventListener('click', () => {
                    searchInput.value = chip.textContent;
                    const results = searchVideos(chip.textContent);
                    renderSearchResults(results, chip.textContent);
                    document.getElementById('searchSuggestions').style.display = 'none';
                });
            });
        }

        // Event listeners
        filterBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                filterBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                renderVideos(btn.dataset.filter);
            });
        });

        modalClose.addEventListener('click', closeModal);
        modal.addEventListener('click', (e) => {
            if (e.target === modal) closeModal();
        });
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeModal();
        });

        // Search event listeners
        searchInput.addEventListener('focus', () => {
            searchDropdown.classList.add('active');
            if (!searchInput.value.trim()) {
                document.getElementById('searchSuggestions').style.display = 'block';
                searchResults.innerHTML = '';
            }
        });

        searchInput.addEventListener('input', () => {
            const query = searchInput.value.trim();
            if (query) {
                const results = searchVideos(query);
                renderSearchResults(results, query);
                document.getElementById('searchSuggestions').style.display = 'none';
            } else {
                searchResults.innerHTML = '';
                document.getElementById('searchSuggestions').style.display = 'block';
            }
        });

        document.addEventListener('click', (e) => {
            if (!e.target.closest('.search-container')) {
                searchDropdown.classList.remove('active');
            }
        });

        // Initialize
        renderVideos();
        renderSuggestions();
    </script>
