name = "wrapsheet"
main = "Wrap.js"
compatibility_date = "2024-01-01"

[[d1_databases]]
binding = "WRAP_DB"
database_name = "wrap_sheet"
database_id = "fbba489f-fc17-4472-b70f-578ce5fd9933"

# Service Binding to GrowthZone proxy worker
[[services]]
binding = "GZ_PROXY"
service = "gz-realestate-proxy"

# Background sync from GrowthZone to D1 every 30 minutes
[triggers]
crons = ["*/30 * * * *"]
